# Runs the test suites on every push and pull request.
#
# This is the point where the suites stop being something you remember to run
# and start being something that runs itself. Three jobs, in parallel, all fast:
# the backend integration tests against a real Postgres, the client unit tests in
# Node, and the app-version gate.
#
# The slow/race tests are deliberately NOT here — see the `slow-tests` workflow.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight; there's no
# value in finishing CI for a commit that's already been superseded.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The sync endpoints need real Postgres (ON CONFLICT, nextval, advisory
    # locks), so CI runs one as a service container rather than faking it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wnotes
          POSTGRES_PASSWORD: wnotes
          POSTGRES_DB: wnotes
        ports:
          - 5432:5432
        # Without the health check the job can start querying before Postgres is
        # accepting connections, which fails as a confusing connection error.
        options: >-
          --health-cmd "pg_isready -U wnotes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 5432 here, not the 5433 used locally: the service container has the port
      # to itself, so there's no local Postgres to avoid colliding with.
      TEST_DATABASE_URL: postgresql+asyncpg://wnotes:wnotes@localhost:5432/wnotes_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Dockerfile's python:3.12-slim. CI should mirror what
          # ships, not whatever happens to be on a developer's machine.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      # Kept as a separate step rather than folded into the run above, so a
      # failure says at a glance whether a deterministic contract test broke or
      # a probabilistic race test did — they warrant very different reactions.
      # Running them per-push rather than nightly is deliberate: pushes here are
      # about daily anyway, so the cadence is the same, but a per-push failure
      # is attributable to one commit instead of to a day's worth. And since the
      # seq-gap test catches its regression ~3 runs in 4, repeated runs compound
      # (1 - 0.25^n) — more runs is strictly better detection.
      - name: Run slow tests
        run: pytest -q -m slow

  web:
    name: Client (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes-app/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync — stricter than `npm install`, which is what you
      # want in CI.
      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: Web E2E (playwright)
    runs-on: ubuntu-latest
    # A separate job so it can't slow the fast suites down. Those report in well
    # under a minute; this one has to boot Metro and a browser, so it lands
    # later — and the two failures mean very different things.
    defaults:
      run:
        working-directory: notes-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes-app/package-lock.json

      - name: Install
        run: npm ci

      # `--with-deps` pulls the system libraries headless Chromium needs on a
      # bare runner; without them the browser fails to launch at all.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts Metro itself (webServer in playwright.config.ts), and
      # reuseExistingServer is off under CI so it always gets a clean one.
      - name: Run E2E tests
        run: npm run test:e2e

      # The report carries traces and screenshots for whatever failed — the
      # difference between debugging a CI failure and trying to reproduce it.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: notes-app/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The same gate `.githooks/pre-push` applies, applied where it actually bites.
  #
  # That hook only sees pushes to `refs/heads/main`, and nothing reaches main by
  # that route any more — it arrives as a merged pull request, which the hook
  # never observes. So the rule was real and the enforcement was not: PR #92
  # shipped a whole feature to production still calling itself 1.0.0, and nobody
  # found out until the next release tried to work out what was in it.
  #
  # This is the same comparison against the branch this PR would merge into. The
  # hook keeps its own copy because it is worth failing in a second locally
  # rather than in two minutes here; if you change one, change both.
  # ---------------------------------------------------------------------------
  version:
    name: App version
    runs-on: ubuntu-latest
    # Pull requests only. A push to main has either come through a PR that has
    # already been gated, or straight from a machine where the hook ran.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          # The merge base is on the base branch, which a shallow clone of the
          # head does not contain — without this every comparison below reads an
          # empty old version and the gate silently passes everything.
          fetch-depth: 0

      - name: Check the version moved with the shipped code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Narrow on purpose, and identical to the hook's list: app source,
          # assets, native config, patches and the backend ship; a workflow tweak
          # or a README does not.
          #
          # app.json and package.json are absent by name — they carry the version
          # itself, so a bump commit would demand a second bump. They are picked
          # up by content instead, via version_free_diff() below.
          SHIPPED_PATHS='^(notes-app/(src/|assets/|app\.config\.js$|patches/)|backend/)'

          # A subset: paths compiled into the binary rather than shipped as JS.
          # These demand the MINOR, because notes-app/app.config.js derives the
          # OTA runtime version from major.minor — holding the lineage steady
          # would let an eas update land this JS on binaries that lack the native
          # code it calls.
          BINARY_PATHS='^notes-app/(android/|patches/|app\.config\.js$)'

          read_version() {
            git show "$1:$2" 2>/dev/null | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                try {
                  const json = JSON.parse(raw);
                  const version = (json.expo && json.expo.version) || json.version || "";
                  process.stdout.write(String(version));
                } catch {
                  process.stdout.write("");
                }
              });
            '
          }

          # What changed in a version-carrying JSON file, ignoring the version
          # line. Empty means the file moved for the bump and nothing else.
          version_free_diff() {
            git diff --unified=0 "$1" "$2" -- "$3" |
              grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-][[:space:]]*"version":' || true
          }

          # package.json is watched because it holds the *dependencies*, which are
          # compiled into the binary. Two of its keys are not that: `version` is the bump
          # itself, and `scripts` are npm command definitions that never enter a bundle
          # on any platform. Comparing the file with both removed is what tells "a
          # dependency moved" from "someone added a deploy script".
          #
          # This is a structural exclusion, unlike app.json above. There, guessing whether
          # a key is native is brittle and the conservative default earns its keep. Here
          # there is nothing to guess: npm does not ship `scripts` to a device, so a
          # change confined to it cannot be the thing this gate exists to catch. Demanding
          # a minor for one is not merely noisy — it starts a new OTA lineage, which
          # orphans every installed binary from updates until a fresh build reaches it.
          pkg_json_binary_diff() {
            _old=$(git show "$1:notes-app/package.json" 2>/dev/null || true)
            _new=$(git show "$2:notes-app/package.json" 2>/dev/null || true)
            OLD="$_old" NEW="$_new" node -e '
              const strip = (raw) => {
                const json = JSON.parse(raw || "{}");
                delete json.version;
                delete json.scripts;
                return JSON.stringify(json);
              };
              try {
                if (strip(process.env.OLD) !== strip(process.env.NEW)) {
                  process.stdout.write("changed");
                }
              } catch {
                // Unparseable on either side: say it changed rather than waving it
                // through. The gate should stay conservative when it cannot tell.
                process.stdout.write("unparseable");
              }
            '
          }

          # The runtime lineage of a display version: 1.2.3 -> 1.2.
          lineage() {
            printf '%s' "$1" | cut -d. -f1,2
          }

          # The minor bump after a version, for the error message. Falls back to
          # prose rather than doing arithmetic on something that isn't a number.
          suggest_minor() {
            _major=$(printf '%s' "$1" | cut -d. -f1 -s)
            _minor=$(printf '%s' "$1" | cut -d. -f2 -s)
            case "$_major.$_minor" in
              *[!0-9.]* | '.' | .* | *.) printf 'the next minor' ;;
              *) printf '%s.%s.0' "$_major" "$((_minor + 1))" ;;
            esac
          }

          # The merge base, not the base branch tip: comparing against the tip
          # would count everything that landed on main since this branch started
          # as if this PR had changed it.
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$base" "$HEAD_SHA")

          app_json_other=$(version_free_diff "$base" "$HEAD_SHA" notes-app/app.json)
          pkg_json_other=$(pkg_json_binary_diff "$base" "$HEAD_SHA")

          binary_changed=''
          if printf '%s' "$changed" | grep -qE "$BINARY_PATHS"; then
            binary_changed=1
          fi
          if [ -n "$app_json_other" ] || [ -n "$pkg_json_other" ]; then
            binary_changed=1
          fi

          if ! printf '%s' "$changed" | grep -qE "$SHIPPED_PATHS" && [ -z "$binary_changed" ]; then
            echo "No shipped code in this PR — nothing to version."
            exit 0
          fi

          old_version=$(read_version "$base" notes-app/app.json)
          new_version=$(read_version "$HEAD_SHA" notes-app/app.json)
          pkg_version=$(read_version "$HEAD_SHA" notes-app/package.json)

          if [ -z "$new_version" ]; then
            echo "::error::couldn't read expo.version from notes-app/app.json"
            exit 1
          fi

          # app.config.js derives runtimeVersion by slicing this string and
          # throws on anything it can't parse. Fail here rather than at build.
          if ! printf '%s' "$new_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app version $new_version is not major.minor.patch — the OTA runtime version is derived from it"
            exit 1
          fi

          if [ "$new_version" = "$old_version" ]; then
            echo "::error::shipped code changed but the app version is still $new_version"
            echo "Shipped files in this PR:"
            printf '%s' "$changed" | grep -E "$SHIPPED_PATHS" | sed 's/^/    /' | sort -u || true
            if [ -n "$app_json_other" ]; then
              echo "    notes-app/app.json      (native config changed, not just the version)"
            fi
            if [ -n "$pkg_json_other" ]; then
              echo "    notes-app/package.json  (dependencies changed, not just version/scripts)"
            fi
            echo ""
            echo "Bump notes-app/app.json (expo.version) and notes-app/package.json (version) — they must agree."
            exit 1
          fi

          if [ -n "$pkg_version" ] && [ "$pkg_version" != "$new_version" ]; then
            echo "::error::version mismatch — app.json says $new_version, package.json says $pkg_version"
            exit 1
          fi

          if [ -n "$binary_changed" ]; then
            if [ "$(lineage "$old_version")" = "$(lineage "$new_version")" ]; then
              echo "::error::this PR needs a new binary but only moved the patch digit ($old_version -> $new_version, runtime lineage stays $(lineage "$new_version"))"
              printf '%s' "$changed" | grep -E "$BINARY_PATHS" | sed 's/^/    /' | sort -u || true
              if [ -n "$app_json_other" ]; then
                echo "    notes-app/app.json      (native config changed, not just the version)"
              fi
              if [ -n "$pkg_json_other" ]; then
                echo "    notes-app/package.json  (dependencies changed, not just version/scripts)"
              fi
              echo ""
              echo "Those are compiled into the app, not shipped as JS. Held at the same lineage,"
              echo "an eas update would land this JS on binaries that lack it."
              echo "Bump the minor instead: $(suggest_minor "$old_version")"
              exit 1
            fi
            echo "app version $old_version -> $new_version (new runtime lineage $(lineage "$new_version") — needs eas build)"
          else
            echo "app version $old_version -> $new_version (runtime lineage $(lineage "$new_version") — ships via eas update)"
          fi
