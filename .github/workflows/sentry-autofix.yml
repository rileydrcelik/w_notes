# Sentry autofix — runs the Claude Code Action when the w_notes backend fires a
# `repository_dispatch` (event_type: sentry-autofix). Claude reads the Sentry
# error context from client_payload, applies a minimal fix, commits to a fixed
# `autofixes/issue-*` branch, and opens a PR to main. This workflow never merges
# — but in this repo `autofix-ship.yml` picks the PR up once Tests goes green and
# merges + deploys it automatically. Delete that file to return to review-first.
#
# This repo (rileydrcelik/w_notes) is the autofix target, so the workflow lives
# here. Requires an ANTHROPIC_API_KEY repo secret and, in Settings → Actions →
# General → Workflow permissions, "Allow GitHub Actions to create and approve
# pull requests" enabled (the built-in token can't open PRs otherwise).
# The canonical copy (for adding autofix to OTHER repos later) is in
# backend/docs/autofix/.

name: Sentry autofix

# The attempt branch goes in the run's title because it is the only way to find
# this run again. A `repository_dispatch` run exposes its `client_payload`
# nowhere in the REST API, so without this the backend's status poll cannot tell
# "the agent is still working" from "the run finished and proposed nothing" — and
# the app spun a "Queued…" chip for two minutes over a run that had already ended.
run-name: Sentry autofix ${{ github.event.client_payload.branch }}

on:
  repository_dispatch:
    types: [sentry-autofix]

# Least privilege: write code (branch/commit) and open PRs. No merge permission.
# Naming any permission sets every unnamed one to `none`, so `actions: read` has
# to be explicit — the dismissal step reads this repo's deploy history to date
# the running code. Without it that read 403s, `deployed` comes back empty, and
# the step quietly stops ever dismissing anything: safe, but silently inert.
permissions:
  contents: write
  pull-requests: write
  actions: read

# One run per issue branch; a repeat dispatch cancels the stale run rather than
# racing it. Also caps token spend from accidental double-taps.
concurrency:
  group: sentry-autofix-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The version bump below is pushed with these credentials. A push made
          # with GITHUB_TOKEN cannot trigger workflows, so if the PR already
          # exists its `synchronize` would never run Tests, and autofix-ship
          # would wait forever for a run that cannot happen.
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      # AUTOFIX_PAT, not GITHUB_TOKEN. A PR opened by github-actions[bot] is
      # treated as coming from a first-time contributor, so its `pull_request`
      # workflows sit unrun awaiting maintainer approval — and approving one does
      # NOT emit a second `workflow_run: completed` event, so autofix-ship never
      # sees it. The fix has to be upstream of the gate: authoring as a real
      # contributor means Tests just runs.
      #
      # Loosening the repo's approval setting would also work, but this repo is
      # public: that would auto-run workflows for every stranger's PR, and a
      # poisoned Actions cache from one of them would later be restored by a
      # main-branch run that does hold secrets and does deploy. A PAT unblocks
      # only our own automation.
      #
      # Falls back to GITHUB_TOKEN when the secret is absent, so a fork of this
      # repo still gets a working (if gated) autofix rather than a broken one.
      - name: Claude autofix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          base_branch: main
          # Cost tiering: default to Haiku 4.5 (cheapest — most Sentry bugs are
          # trivial, and every fix is PR-reviewed so a weak attempt just gets
          # rejected). The backend can override per-issue via
          # client_payload.details.model ("Sonnet on demand" for hard fixes); that
          # path deliberately keeps Claude Code's default (capable) effort, since it
          # only runs when Haiku wasn't enough. --max-turns is the runaway guard — a
          # stuck run otherwise burns money for no PR. (A hard $ cap via
          # --max-budget-usd is a further option once verified against this action's
          # bundled CLI version.)
          # NB: do NOT add --effort — Haiku 4.5 rejects the effort parameter.
          claude_args: |
            --allowedTools Edit,Read,Write,Bash
            --model ${{ github.event.client_payload.details.model || 'claude-haiku-4-5' }}
            --max-turns 50
          prompt: |
            A production error was reported by Sentry. Fix its root cause in this repository.

            Work on a branch named EXACTLY this — create it from `main`, commit only there,
            and open a pull request from it into `main`. Do NOT merge, and do NOT push to main:
              BRANCH: ${{ github.event.client_payload.branch }}

            The pull request title should start with "Autofix:" and reference the Sentry issue
            ${{ github.event.client_payload.short_id }}. In the PR body, summarize the root cause
            and the fix, and link the Sentry issue: ${{ github.event.client_payload.permalink }}

            The stack frames in the payload below point at the code involved — start there.
            Make the smallest fix that addresses the root cause; keep it minimal. Don't explore
            or change files beyond the implicated ones unless the fix genuinely requires it. If
            you cannot confidently identify a fix from the context below, open the PR anyway with
            your analysis and a proposed direction rather than guessing broadly.

            One case is different: if no code change is warranted at all — the fix is already on
            `main`, or the cause is outside this repository (a misconfigured URL, a service that is
            down, a missing credential) — then do NOT create the branch and do NOT open a pull
            request. End your final message with a short verdict instead: what the code already
            does, and what would actually have to change to stop the error. That message is the
            whole result of the run and is read back into the app, so make it stand alone.

            In that case ALSO write this file, which the pipeline reads to decide whether the
            Sentry issue can be closed:
              ${{ runner.temp }}/autofix-verdict.json
            containing exactly {"verdict": "<one of below>", "summary": "<one sentence>"}:
              already-fixed  — the code that would stop this error is on `main` today. Use this
                               only when the error could not still be happening against current
                               `main`; if the code is right and the error is real, it is not this.
              external-cause — this repository is behaving correctly and something outside it has
                               to change. An error still firing against correct code is this one.
              needs-human    — you could not tell.
            Be strict about the first: an `already-fixed` claim is the only one that can close a
            live production issue, and closing one that is still firing hides an outage. When
            torn between `already-fixed` and `external-cause`, choose `external-cause`.

            --- Sentry issue ---
            Issue: ${{ github.event.client_payload.short_id }} — ${{ github.event.client_payload.title }}
            Level: ${{ github.event.client_payload.level }}
            Culprit: ${{ github.event.client_payload.culprit }}
            Exception: ${{ github.event.client_payload.exception_type }}: ${{ github.event.client_payload.exception_value }}
            Sentry link: ${{ github.event.client_payload.permalink }}

            Stack frames (in-app, nearest the crash first) and request/breadcrumb context are in
            this JSON payload:
            ${{ toJSON(github.event.client_payload) }}

      # The agent's own words, in the run summary. The action runs Claude through
      # the SDK with its output hidden (it can echo whatever it read), so when a
      # run ends without a branch — the agent decided the code was already
      # correct, or the cause is outside this repo — the log says nothing about
      # why. That verdict is the entire result of such a run, and the app now
      # links here to show it, so the one message that carries it is worth
      # lifting out. Best-effort: a missing or unexpected file just skips.
      - name: Summarize what the agent concluded
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          [ -f "$EXECUTION_FILE" ] || { echo "No execution file at $EXECUTION_FILE."; exit 0; }
          verdict=$(jq -r '[.[]? | select(.type == "result") | .result // empty] | last // empty' \
            "$EXECUTION_FILE" 2>/dev/null || true)
          if [ -z "$verdict" ]; then
            verdict=$(jq -r '[.[]? | select(.type == "assistant") | .message.content[]?
              | select(.type == "text") | .text] | last // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          [ -n "$verdict" ] || { echo "Could not read a final message from the run."; exit 0; }
          {
            echo "## What the agent concluded"
            echo
            echo "$verdict"
          } >> "$GITHUB_STEP_SUMMARY"

      # The version gate (tests.yml, .githooks/pre-push) counts backend/ as
      # shipped code on purpose: a deploy changes what the product does even
      # though no app code moved, and one number should cover the whole release.
      # A human bumps it by hand. The agent has no idea the rule exists, so every
      # backend autofix failed "App version" — and autofix-ship only starts on a
      # *green* Tests run, so the pipeline was dead for exactly the errors it
      # gets most. PR #97 is the example.
      #
      # So the pipeline does what the human does. Deliberately not the agent's
      # job: this is arithmetic on a known field, and asking a model to do it
      # would add a way for the fix to be wrong without adding anything.
      - name: Bump the app version
        if: always()
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          set -euo pipefail
          # Kept in sync with tests.yml and .githooks/pre-push by hand. If they
          # ever disagree, the gate is the one that decides — this only chooses
          # whether to offer a bump, and a wrong guess costs a red PR, not a
          # bad release.
          SHIPPED_PATHS='^(notes-app/(src/|assets/|app\.config\.js$|patches/)|backend/)'
          BINARY_PATHS='^notes-app/(android/|patches/|app\.config\.js$)'

          git fetch origin main
          if ! git fetch origin "$BRANCH"; then
            echo "No branch $BRANCH — no fix was proposed. Nothing to version."
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"

          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          if [ -z "$changed" ]; then
            echo "Branch has no commits over main. Nothing to version."
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qE "$SHIPPED_PATHS"; then
            echo "Nothing shipped in this fix — the gate won't ask for a bump."
            exit 0
          fi

          # Read it the way the gate reads it, so the two never disagree about
          # what the current version is.
          read_version() {
            git show "$1:notes-app/app.json" 2>/dev/null | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                try {
                  const json = JSON.parse(raw);
                  process.stdout.write(String((json.expo && json.expo.version) || ""));
                } catch {
                  process.stdout.write("");
                }
              });
            '
          }
          old=$(read_version "$base")
          cur=$(read_version HEAD)
          if [ -z "$cur" ]; then
            echo "::warning::couldn't read expo.version — leaving the version alone."
            exit 0
          fi
          if [ "$old" != "$cur" ]; then
            echo "The agent already moved the version ($old -> $cur). Leaving it."
            exit 0
          fi
          if ! printf '%s' "$cur" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::version $cur is not major.minor.patch — leaving it for a human."
            exit 0
          fi

          major=${cur%%.*}; rest=${cur#*.}; minor=${rest%%.*}; patch=${rest##*.}
          # android/, patches/ and app.config.js are compiled into the binary
          # rather than shipped as JS, so the gate demands a new OTA lineage —
          # the minor — not just any bump. Vanishingly rare for an autofix, but
          # a patch bump there would fail the gate just as surely as none.
          if printf '%s\n' "$changed" | grep -qE "$BINARY_PATHS"; then
            new="$major.$((minor + 1)).0"
            why="binary paths changed, so this needs a new OTA lineage and an eas build"
          else
            new="$major.$minor.$((patch + 1))"
            why="ships via eas update"
          fi

          # sed, not jq: jq reprints the whole document, which would bury a
          # one-line fix under a reindentation diff. Each file carries exactly
          # one "version" line — assert that before trusting a substitution.
          for f in notes-app/app.json notes-app/package.json; do
            n=$(grep -cE '^[[:space:]]*"version":' "$f" || true)
            [ "$n" = "1" ] || { echo "::error::$f has $n version lines, expected 1"; exit 1; }
            sed -i -E 's/^([[:space:]]*"version":[[:space:]]*")[^"]*(",?)$/\1'"$new"'\2/' "$f"
            grep -q "\"version\": \"$new\"" "$f" || { echo "::error::$f did not take the bump"; exit 1; }
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes-app/app.json notes-app/package.json
          git commit -m "Bump the app version to $new" \
            -m "The version gate counts this fix as shipped code ($why)."
          git push origin "$BRANCH"
          echo "app version $cur -> $new ($why)"
      # The action pushes the fix branch but, on a repository_dispatch trigger,
      # doesn't reliably open the PR itself (no comment thread to open it from).
      # This guarantees a PR exists whenever the branch has commits — idempotent,
      # so it's a no-op if the action already opened one. Still PR-only, no merge.
      - name: Ensure pull request
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.client_payload.branch }}
          SHORT_ID: ${{ github.event.client_payload.short_id }}
          PERMALINK: ${{ github.event.client_payload.permalink }}
        run: |
          set -euo pipefail
          # A run that proposes nothing is a legitimate outcome — most often the
          # fix is already on main and the error is recurring for a reason outside
          # this repo. It stays a green run, and the backend reads "finished, no
          # branch, no PR" as that verdict; the notice is for whoever opens the run.
          nofix() {
            echo "::notice::$1"
            echo "**No fix proposed.** $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if ! git fetch origin "$BRANCH"; then
            nofix "No branch $BRANCH was pushed — nothing to open a PR for."
          fi
          commits=$(git rev-list --count "origin/main..origin/$BRANCH")
          if [ "$commits" -eq 0 ]; then
            nofix "Branch $BRANCH has no commits over main — no fix to propose."
          fi
          # --state open, not --state all: the check is "would this duplicate a
          # PR that's already up for review", and only an open PR can be
          # duplicated. Matching closed ones too meant a branch whose earlier PR
          # had been rejected could never get a new PR opened for it again.
          # `opened` is how the dismissal step below knows a fix was proposed after
          # all. Only the paths that end with a PR set it, so every `nofix` exit
          # leaves it unset and the issue gets considered for dismissal instead.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "An open pull request for $BRANCH already exists."
            echo "opened=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr create --head "$BRANCH" --base main \
            --title "Autofix: $SHORT_ID" \
            --body "Automated fix for Sentry issue $SHORT_ID. See $PERMALINK"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # The `autofix` label is what marks a PR as machine-authored and therefore
      # eligible for automatic merge. It matters more now that the PAT makes
      # these PRs look like the repo owner's own: without an explicit marker,
      # autofix-ship could not tell an agent's PR from a hand-written one that
      # happened to sit on an `autofixes/*` branch. Applied to whichever PR
      # exists, since the action sometimes opens it and sometimes this job does.
      - name: Label the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for $BRANCH to label."
            exit 0
          fi
          gh pr edit "$number" --add-label autofix
          echo "Labelled PR #$number as autofix."

      # A pull request is a proposal, not a fix. This step used to resolve the
      # Sentry issue right here, which closed it on the strength of the branch
      # existing: a PR that failed CI, or was rejected on review, left a live
      # production error hidden behind a "resolved" chip with nothing shipped.
      # PR #97 did exactly that — it reverted a deliberate fix, went red, was closed,
      # and left the issue resolved the whole time.
      #
      # So this step only *records* which Sentry issue the PR answers.
      # autofix-ship.yml reads the marker back and does the resolving once the
      # fix has actually landed — and, for a backend fix, deployed. The id is
      # written by the pipeline rather than scraped from the agent's prose, which
      # is free-form and need not mention the numeric id at all.
      - name: Record the Sentry issue on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.client_payload.branch }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id }}
          SHORT_ID: ${{ github.event.client_payload.short_id }}
        run: |
          set -euo pipefail
          [ -n "${ISSUE_ID:-}" ] || { echo "No issue_id in the payload — nothing to record."; exit 0; }
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for $BRANCH — nothing to record the issue on."
            exit 0
          fi
          body=$(gh pr view "$number" --json body --jq '.body')
          case "$body" in
            *"w-notes:sentry-issue"*) echo "PR #$number already carries the marker."; exit 0 ;;
          esac
          printf '%s\n\n<!-- w-notes:sentry-issue id=%s short_id=%s -->\n' \
            "$body" "$ISSUE_ID" "$SHORT_ID" | gh pr edit "$number" --body-file -
          echo "Recorded Sentry issue $ISSUE_ID ($SHORT_ID) on PR #$number."

      # The other way an issue can be finished with: the agent proposed no fix
      # because the fix is already on `main`. That closes the issue too — but only
      # when it is *provably* stale, which is not the same claim.
      #
      # "The code is right" and "the error has stopped" are different facts, and
      # W-NOTES-FASTAPI-A is exactly the pair coming apart: commit 4ee6168 is the
      # fix, and the 404 it reports is still arriving on every publish because the
      # cause is a service outside this repo. Resolving on the agent's word alone
      # would have silenced the alarm that commit was written to raise.
      #
      # So the agent's `already-fixed` verdict is necessary but not sufficient. The
      # deciding test is evidence: has this issue fired since the code now running
      # in production went out? If it has, nothing on `main` is stopping it,
      # whatever the verdict says. No deploy to compare against (a front-end issue,
      # a repo that doesn't deploy this way) means no evidence, so nothing closes.
      - name: Dismiss the Sentry issue if it is provably stale
        if: always() && steps.pr.outputs.opened != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          ISSUE_ID: ${{ github.event.client_payload.issue_id }}
          SHORT_ID: ${{ github.event.client_payload.short_id }}
          BRANCH: ${{ github.event.client_payload.branch }}
          VERDICT_FILE: ${{ runner.temp }}/autofix-verdict.json
          REPO: ${{ github.repository }}
          PROJECT: ${{ github.event.client_payload.details.project }}
          # The one Sentry project whose fixes reach production by merging here.
          # This repo also serves `w-notes-rn`, which ships by EAS build and so
          # has no merge-time deploy to date an error against. Override per repo
          # with an AUTOFIX_DEPLOYED_PROJECT variable.
          DEPLOYED_PROJECT: ${{ vars.AUTOFIX_DEPLOYED_PROJECT || 'w-notes-fastapi' }}
        run: |
          set -uo pipefail
          keep() {
            echo "::notice::$SHORT_ID left open: $1"
            echo "**Left open in Sentry.** $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -n "${SENTRY_API_TOKEN:-}" ] || keep "no SENTRY_API_TOKEN secret."
          [ -f "$VERDICT_FILE" ] || keep "the run recorded no verdict."

          # `opened` is the step-output half of "no fix was proposed"; this is the
          # half that doesn't depend on the previous step having got far enough to
          # write it. If `gh pr create` succeeds server-side but the client call
          # then fails, that step aborts before setting the output and this one
          # runs with a real PR sitting open. Ask GitHub instead of inferring.
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            keep "a pull request for $BRANCH is open after all."
          fi

          verdict=$(jq -r '.verdict // empty' "$VERDICT_FILE" 2>/dev/null || true)
          summary=$(jq -r '.summary // empty' "$VERDICT_FILE" 2>/dev/null || true)
          echo "Verdict: ${verdict:-none} — ${summary:-no summary}"
          [ "$verdict" = "already-fixed" ] || keep "verdict is '${verdict:-unreadable}', not 'already-fixed'."

          # The deploy timestamp below only dates *this* repo's backend. Measuring
          # any other surface against it compares an error to a deploy that could
          # not have carried its fix — and because the backend deploys often, that
          # comparison usually reads "stale" by coincidence and closes a mobile
          # issue that is still live on every device running the old build. The
          # projects are not interchangeable, so anything else keeps.
          [ -n "$PROJECT" ] || keep "the dispatch didn't say which Sentry project this is."
          [ "$PROJECT" = "$DEPLOYED_PROJECT" ] \
            || keep "$PROJECT doesn't ship by merging here, so there is no deploy to date it against."

          # When production last changed. `updated_at` is the run's finish time,
          # so this is "the moment the code now live went live".
          deployed=$(gh api \
            "/repos/$REPO/actions/workflows/deploy-backend.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty' 2>/dev/null || true)
          [ -n "$deployed" ] || keep "no successful deploy to measure staleness against."

          last_seen=$(curl -sS "https://sentry.io/api/0/issues/$ISSUE_ID/" \
            -H "Authorization: Bearer $SENTRY_API_TOKEN" | jq -r '.lastSeen // empty' || true)
          [ -n "$last_seen" ] || keep "Sentry did not report when it was last seen."

          # Parse before comparing. `[ "" -ge 123 ]` is a *usage* error, not a
          # false comparison: it exits 2, and with no `set -e` that reads as "the
          # condition was false" and drops through to the resolve below. An
          # unparseable timestamp would then close the issue having skipped the
          # only check standing between a live alarm and silence — so each date
          # gets its own explicit failure exit.
          last_epoch=$(date -d "$last_seen" +%s 2>/dev/null) \
            || keep "Sentry's last-seen time '$last_seen' could not be read."
          deploy_epoch=$(date -d "$deployed" +%s 2>/dev/null) \
            || keep "the deploy time '$deployed' could not be read."
          if [ "$last_epoch" -ge "$deploy_epoch" ]; then
            keep "it fired at $last_seen, after the running code deployed at $deployed — it is not fixed."
          fi

          code=$(curl -sS -X PUT "https://sentry.io/api/0/issues/$ISSUE_ID/" \
            -H "Authorization: Bearer $SENTRY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"resolved"}' -o /dev/null -w "%{http_code}")
          if [ "$code" -ge 400 ]; then
            echo "::warning::Sentry resolve returned $code"
            exit 0
          fi
          echo "::notice::$SHORT_ID resolved — already fixed on main, last seen $last_seen, before the deploy at $deployed."
          {
            echo "**Dismissed as already fixed.** ${summary:-The fix is already on main.}"
            echo
            echo "Last seen \`$last_seen\`, before the running code deployed at \`$deployed\`."
          } >> "$GITHUB_STEP_SUMMARY"
