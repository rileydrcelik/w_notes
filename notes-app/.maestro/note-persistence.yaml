# Does a note survive the app being killed and relaunched?
#
# The native counterpart of the web suite's reload test, and the reason mobile
# E2E earns its keep at all: this path runs `expo-sqlite`'s **native** module,
# a completely different implementation from the wa-sqlite/OPFS build the web
# tests cover. Same app code, same schema, different storage engine underneath —
# and the two have failed differently before (overlapping transactions aborting
# each other was native-only).
#
# `stopApp` kills the process outright rather than backgrounding it, so nothing
# in memory can carry the note across. Passing means the row genuinely reached
# the on-device database and was read back on a cold start.
#
# **Every step following a launch waits explicitly.** A bare `tapOn` gives up
# after Maestro's default lookup window, and a cold start here is not quick: the
# splash overlay, the database open (migrations, and on an empty library the
# first-run content), and the stores' first read all happen before there is
# anything on screen to tap. `clearState` means every run pays that cost in
# full. It was enough to make this flow fail three different ways against the
# same code — "Create" not found, `inputText` hanging with nothing focused, and
# the assertion finding no note — none of which were the thing under test.
#
# Waiting for the app to be ready is not the same as making the test lenient.
# What is asserted is unchanged; the timeouts only bound how long we are willing
# to wait before starting to measure. If one of them is ever actually reached,
# that is a real regression in startup time and should be read as one.
appId: com.rileydrcelik.wnotes.dev
---
- clearState
- launchApp

# The tab bar mounts once the router has resolved a route — which is *before*
# the first-run seed and the home list's first render are done, so "Create is
# visible" is not "the app is idle". Tapping there fires into the heaviest work
# of the run, and on a software-GPU emulator that is not a slow tap, it is a
# broken one: the frames carrying the tap's DOWN and UP were measured 717ms
# apart, and React Native arms its long-press timer at 500ms. The button then
# receives a genuine `onLongPress` from a short tap, opens the create menu
# instead of a note, and the next step fails looking for 'Title'.
#
# So wait for something that is only true once the seed has landed and been
# rendered, then let animations settle. On a real phone this costs nothing; on
# a slow emulator it is the difference between measuring the app and measuring
# the input queue. Raising `delayLongPress` on the button would be papering
# over this — the app's behaviour is correct, the harness was mis-measuring.
- extendedWaitUntil:
    visible: 'Create'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Welcome to w_notes'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: 'Create'

# Tap the title field before typing. `inputText` goes to whatever holds focus,
# and the editor opens with nothing focused — without this the text is typed
# into the void. That leaves the note completely empty, which the note screen
# discards on the way out, so the failure surfaces as the note being absent
# rather than as anything pointing at the typing.
- extendedWaitUntil:
    visible: 'Title'
    timeout: 30000
- tapOn: 'Title'
- inputText: 'maestro note'
- tapOn: 'Go back'

- extendedWaitUntil:
    visible: 'maestro note'
    timeout: 30000

- stopApp
- launchApp

# The one that matters: a cold start reading back from the device's database.
# Its own generous window, because this launch pays for the database open before
# it can render a single card.
- extendedWaitUntil:
    visible: 'maestro note'
    timeout: 60000
